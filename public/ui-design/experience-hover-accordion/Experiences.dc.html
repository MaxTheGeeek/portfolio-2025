<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #05070d; }
    ::selection { background: rgba(34,211,238,0.3); }
  </style>
</helmet>
<div style="{{ sectionStyle }}">
  <sc-for list="{{ dots }}" as="d" hint-placeholder-count="0">
    <div style="{{ d.style }}"></div>
  </sc-for>

  <div style="max-width: 1180px; margin: 0 auto; padding: 96px 32px; position: relative;">
    <div style="margin-bottom: 56px;">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 2px; color: #22d3ee; font-weight: 600; margin-bottom: 12px;">CAREER TIMELINE</div>
      <h2 style="font-family: 'Inter', sans-serif; font-size: 40px; font-weight: 700; color: #f1f5f9; margin: 0;">Experience</h2>
    </div>

    <div style="position: relative;">
      <sc-for list="{{ experiences }}" as="exp" hint-placeholder-count="3">
        <div style="{{ exp.rowStyle }}">
          <div style="{{ exp.dateColStyle }}">
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #22d3ee;">{{ exp.startLabel }}</div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #64748b; margin-top: 6px; line-height: 1.4;">{{ exp.rangeLabel }}</div>
          </div>

          <div style="{{ exp.lineColStyle }}">
            <div style="{{ exp.dotStyle }}"></div>
          </div>

          <div style="{{ exp.cardStyle }}" onMouseEnter="{{ exp.onEnter }}" onMouseLeave="{{ exp.onLeave }}">
            <sc-for list="{{ exp.cardDots }}" as="cd" hint-placeholder-count="0">
              <div style="{{ cd.style }}"></div>
            </sc-for>

            <div style="position: relative; z-index: 1;">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
                <div>
                  <h3 style="font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; color: #f8fafc; margin: 0 0 6px 0;">{{ exp.title }}</h3>
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.5px; color: #a78bfa; font-weight: 500;">{{ exp.company }} · {{ exp.location }}</div>
                </div>
                <sc-if value="{{ exp.current }}" hint-placeholder-val="{{ false }}">
                  <div style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: #22d3ee; border: 1px solid rgba(34,211,238,0.4); border-radius: 999px; padding: 6px 14px;">PRESENT</div>
                </sc-if>
              </div>

              <div style="{{ exp.bulletsWrapStyle }}">
                <div style="overflow: hidden;">
                  <ul style="margin: 20px 0 0 0; padding: 0 0 0 18px; list-style: none;">
                    <sc-for list="{{ exp.bullets }}" as="b" hint-placeholder-count="4">
                      <li style="{{ exp.bulletItemStyle }}">
                        <span style="position: absolute; left: 0;">•</span>{{ b }}
                      </li>
                    </sc-for>
                  </ul>
                </div>
              </div>

              <div style="{{ exp.badgesRowStyle }}">
                <sc-for list="{{ exp.skills }}" as="s" hint-placeholder-count="6">
                  <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; color: #94a3b8; border: 1px solid rgba(148,163,184,0.25); background: rgba(148,163,184,0.06); border-radius: 999px; padding: 7px 14px; white-space: nowrap;">{{ s }}</div>
                </sc-for>
              </div>

              <div style="{{ exp.hintStyle }}">hover to expand details</div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { openIds: new Set() };
    this._dots = this._makeDots(60, 1600, 900, 'section');
    this._cardDotSeeds = {};
  }

  _makeDots(count, w, h, seedKey) {
    let seed = 42;
    const rand = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const arr = [];
    for (let i = 0; i < count; i++) {
      const x = rand() * w;
      const y = rand() * h;
      const size = rand() > 0.85 ? 2 : 1;
      const op = 0.15 + rand() * 0.35;
      arr.push({
        style: {
          position: 'absolute', left: x + 'px', top: y + 'px', width: size + 'px', height: size + 'px',
          borderRadius: '50%', background: '#e2e8f0', opacity: op, pointerEvents: 'none'
        }
      });
    }
    return arr;
  }

  _cardDots(id) {
    if (!this._cardDotSeeds[id]) this._cardDotSeeds[id] = this._makeDots(14, 1090, 620, id);
    return this._cardDotSeeds[id];
  }

  toggle(id, on) {
    this.setState(s => {
      const next = new Set(s.openIds);
      if (on) next.add(id); else next.delete(id);
      return { openIds: next };
    });
  }

  renderVals() {
    const raw = [
      {
        id: 'e1', title: 'Full-Stack Developer', company: 'RockLogic GmbH', location: 'Vienna, Austria',
        current: true, startLabel: 'MAR 2026', rangeLabel: 'OCT 2025 — MAR 2026',
        bullets: [
          'Accelerated development velocity by integrating Claude Code and Context7 into daily workflows; authored custom project rules (.claudemd / .cursorrules) to enforce Clean Architecture boundaries, leveraged LLMs for complex system brainstorming, and engineered comprehensive AI-driven unit and integration test-suites to maintain high code coverage.',
          'Developed a WPF Desktop Application extending the private banking back-office tool; implemented Parallel UI Migration by building new features in WPF while actively refactoring core modules into a web-based Angular frontend.',
          'Wrote comprehensive technical documentation for internal ASP.NET Core reporting modules, covering service layer design, API contracts, and data-flow diagrams for cross-team handover.',
          'Optimized end-to-end API performance, reducing response latency from 850ms to 120ms for back-office internal tooling and measurably improving daily stakeholder workflows.',
          'Built a B2B analytics platform for Ethereum infrastructure monitoring using Next.js, NestJS, and PostgreSQL, serving 10+ enterprise clients with end-to-end feature ownership.',
          'Designed scalable NestJS microservices integrating Grafana APIs for automated provisioning of 30+ dashboards, including full-stack authentication and data visualization in TypeScript.',
          'Built an internal reporting panel for 8+ non-technical back-office stakeholders, substantially reducing report generation time.',
          'Implemented CI/CD pipelines using Docker and GitHub Actions, significantly reducing deployment time.',
          'Refactored front-end data fetching by replacing legacy state-management workflows with React Query, reducing boilerplate code and stabilizing client-side caching.'
        ],
        skills: ['NEXT.JS', 'NESTJS', 'POSTGRESQL', 'REACT QUERY', 'WPF', 'TYPESCRIPT', 'CLAUDE CODE', 'CONTEXT7', 'AI AUTOMATION']
      },
      {
        id: 'e2', title: 'Software Engineer', company: 'Vantage Systems', location: 'Vienna, Austria',
        current: false, startLabel: 'SEP 2025', rangeLabel: 'FEB 2025 — SEP 2025',
        bullets: [
          'Rebuilt the customer onboarding flow in React and TypeScript, cutting drop-off in the signup funnel through progressive form validation and clearer error states.',
          'Introduced a shared component library adopted across three product squads, reducing duplicate UI code and speeding up feature delivery.',
          'Migrated legacy REST endpoints to a typed GraphQL layer, improving frontend data-fetching reliability and reducing over-fetching.',
          'Set up automated visual regression testing in CI, catching UI regressions before release.'
        ],
        skills: ['REACT', 'GRAPHQL', 'TYPESCRIPT', 'NODE.JS', 'CI/CD']
      },
      {
        id: 'e3', title: 'Junior Developer', company: 'Studio Nine', location: 'Graz, Austria',
        current: false, startLabel: 'JUN 2024', rangeLabel: 'JAN 2024 — JUN 2024',
        bullets: [
          'Implemented responsive marketing pages for client campaigns using Vue and Tailwind, working directly with designers to translate Figma files into production code.',
          'Built a lightweight CMS integration allowing non-technical staff to update campaign content without developer involvement.',
          'Contributed to internal tooling scripts that automated asset optimization, reducing page load times across client sites.'
        ],
        skills: ['VUE', 'TAILWIND', 'FIGMA', 'NODE.JS']
      }
    ];

    const openIds = this.state.openIds;

    const experiences = raw.map((e, i) => {
      const isOpen = openIds.has(e.id);
      return {
        ...e,
        isOpen,
        cardDots: this._cardDots(e.id),
        onEnter: () => this.toggle(e.id, true),
        onLeave: () => this.toggle(e.id, false),
        rowStyle: {
          display: 'grid', gridTemplateColumns: '160px 32px 1fr', columnGap: '24px',
          marginBottom: i === raw.length - 1 ? 0 : '8px', position: 'relative'
        },
        dateColStyle: { textAlign: 'right', paddingTop: '32px' },
        lineColStyle: { position: 'relative', display: 'flex', justifyContent: 'center' },
        dotStyle: {
          position: 'absolute', top: '38px', width: '16px', height: '16px', borderRadius: '50%',
          border: '2px solid #22d3ee', background: '#05070d', boxShadow: '0 0 0 4px rgba(34,211,238,0.12)', zIndex: 2
        },
        cardStyle: {
          position: 'relative', overflow: 'hidden', background: 'rgba(15,20,32,0.55)',
          border: isOpen ? '1px solid rgba(34,211,238,0.35)' : '1px solid rgba(148,163,184,0.15)',
          borderRadius: '16px', padding: '32px', marginBottom: '32px', cursor: 'default',
          transition: 'border-color 0.35s ease, box-shadow 0.35s ease',
          boxShadow: isOpen ? '0 0 0 1px rgba(34,211,238,0.08), 0 20px 40px -20px rgba(34,211,238,0.15)' : 'none'
        },
        bulletsWrapStyle: {
          display: 'grid', gridTemplateRows: isOpen ? '1fr' : '0fr',
          transition: 'grid-template-rows 0.45s cubic-bezier(0.4,0,0.2,1)'
        },
        bulletItemStyle: {
          position: 'relative', fontFamily: 'Inter, sans-serif', fontSize: '15px', lineHeight: 1.6,
          color: '#cbd5e1', marginBottom: '12px'
        },
        badgesRowStyle: {
          display: 'flex', flexWrap: 'wrap', gap: '10px',
          marginTop: isOpen ? '24px' : '20px', transition: 'margin-top 0.45s ease'
        },
        hintStyle: {
          fontFamily: 'JetBrains Mono, monospace', fontSize: '11px', letterSpacing: '0.5px',
          color: '#475569', marginTop: '16px', opacity: isOpen ? 0 : 1,
          height: isOpen ? 0 : 'auto', transition: 'opacity 0.3s ease'
        }
      };
    });

    return {
      experiences,
      dots: this._dots,
      sectionStyle: { position: 'relative', background: '#05070d', minHeight: '100vh', overflow: 'hidden' }
    };
  }
}
</script>
</body>
</html>
